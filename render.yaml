services:
  - type: web
    name: thane-rivers-community
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FLW_CURRENCY
        value: USD
      - key: SITE_NAME
        value: Thane Rivers
      - key: SESSION_SECRET
        generateValue: true
