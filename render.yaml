services:
  - type: web
    name: thane-rivers-community
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FLW_CURRENCY
        value: USD
      - key: SITE_NAME
        value: Thane Rivers
      - key: SESSION_SECRET
        generateValue: true
      # Required for account, membership, chat, and payment records.
      # Render will ask for these values when this Blueprint is first created.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: SUBSCRIPTION_AMOUNT
        value: "50"
      - key: SUBSCRIPTION_MONTHS
        value: "2"
